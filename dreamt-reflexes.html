<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dreamt reflexes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #05050a;
    color: #ccc;
    font-family: -apple-system, system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
  }
  /* Layered radial gradients + tiny repeating dots = lightweight starfield,
     no image asset needed. Two star layers at different sizes/opacities
     for a bit of depth. */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(120,90,200,0.12), transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(60,80,180,0.10), transparent 60%),
      repeating-radial-gradient(circle at 10% 20%, #fff 0 1px, transparent 1px 60px),
      repeating-radial-gradient(circle at 70% 60%, #fff 0 1px, transparent 1px 80px),
      repeating-radial-gradient(circle at 40% 85%, #fff 0 1px, transparent 1px 100px),
      #05050a;
    background-size: 100% 100%, 100% 100%, 140px 140px, 180px 180px, 220px 220px, 100% 100%;
    opacity: 0.8;
  }
  .part {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    will-change: transform, filter, opacity;
    /* invert(1) flips black linework to white; the brightness/contrast
       tweak keeps it from looking flat/grey on the deep space background */
    filter: invert(1) brightness(1.3) contrast(1.1);
  }
  #stage-wrap {
    position: relative;
    width: 100vmin;
    height: 100vmin;
    margin: 0 auto;
    overflow: visible;
    z-index: 1;
  }
  #stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Controls */
  #controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20,20,26,0.85);
    backdrop-filter: blur(10px);
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 10;
  }
  #playBtn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: #e8e8ec;
    color: #111;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  #playBtn:hover { background: #fff; }
  .label { font-size: 12px; color: #999; min-width: 80px; }
  #chaosRange { width: 110px; }

  #debug { display: none; }
</style>
</head>
<body>

<div id="stars"></div>
<div id="debug"></div>

<div id="stage-wrap">
  <div id="stage">
    <!-- Order matters: back to front -->
    <img class="part" id="p-armLeft"  src="assets/armLeft.png"  alt="">
    <img class="part" id="p-armRight" src="assets/armRight.png" alt="">
    <img class="part" id="p-legLeft"  src="assets/legLeft.png"  alt="">
    <img class="part" id="p-legRight" src="assets/legRight.png" alt="">
    <img class="part" id="p-torso"    src="assets/torso.png"    alt="">
    <img class="part" id="p-neck"     src="assets/neck.png"     alt="">
    <img class="part" id="p-guy"      src="assets/guy.png"      alt="">
    <img class="part" id="p-face"     src="assets/face.png"     alt="">
    <img class="part" id="p-eyes"     src="assets/eyes.png"     alt="">
    <img class="part" id="p-mouth"    src="assets/mouth.png"    alt="">
  </div>
</div>

<div id="controls">
  <button id="playBtn">▶</button>
  <span class="label" id="timeLabel">0:00 / 0:00</span>
  <span class="label">chaos</span>
  <input type="range" id="chaosRange" min="0" max="100" value="55">
</div>

<audio id="audio" src="assets/dreamtreflexes-otmr.m4a" preload="auto"></audio>

<script>
/* ============================================================
   DREAMT REFLEXES — audio-reactive limb performer - LuEE the
   ============================================================
   Two-state system per limb:

   DRIFT  - low/sparse-energy sections. Limb wanders slowly
            toward a randomly changing target point out in
            open space (off the body). Continuous, not hit-based.

   DRUM   - triggered when the analyser detects a sustained
            FLURRY of onsets (not just one loud moment) -
            i.e. a "marching band" style burst of rapid hits.
            Limb snaps back home and fires quick percussive
            hits onto its target body part(s).

   The mode is decided globally by a rolling onset-rate
   detector (how many transients occurred in the last ~1.5s),
   not by a hardcoded timestamp - so it adapts to wherever the
   busy section actually falls in the track.
   ============================================================ */

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const timeLabel = document.getElementById('timeLabel');
const chaosRange = document.getElementById('chaosRange');
const debugEl = document.getElementById('debug');

let audioCtx, analyser, sourceNode, freqData;
const FFT_SIZE = 1024;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = FFT_SIZE;
  analyser.smoothingTimeConstant = 0.7;
  sourceNode = audioCtx.createMediaElementSource(audio);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
  freqData = new Uint8Array(analyser.frequencyBinCount);
}

playBtn.addEventListener('click', async () => {
  initAudio();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (audio.paused) {
    audio.play();
    playBtn.textContent = '⏸';
  } else {
    audio.pause();
    playBtn.textContent = '▶';
  }
});

audio.addEventListener('timeupdate', () => {
  const fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  timeLabel.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration||0)}`;
});

function bandAvg(data, startBin, endBin) {
  let sum = 0;
  for (let i = startBin; i < endBin; i++) sum += data[i];
  return sum / (endBin - startBin) / 255;
}

function vmin(pct) {
  return Math.min(window.innerWidth, window.innerHeight) * (pct / 100);
}

function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3) / 2; }
function lerp(a, b, t) { return a + (b - a) * t; }

/* ----------------------------------------------------------
   GLOBAL ONSET / "BUSY-NESS" DETECTOR
   Tracks broadband energy frame to frame. Whenever energy
   jumps sharply above its recent rolling average, that's
   counted as an "onset" (one drum hit, roughly).
   We keep a timestamped list of onsets from the last 1.5s -
   many onsets in that window = marching-band-style flurry.
---------------------------------------------------------- */
const onsetTimes = [];
let prevBroadband = 0;
let rollingAvg = 0;
const ONSET_WINDOW_MS = 1500;
const ONSET_THRESHOLD_FLURRY = 6; // # onsets in window to be considered "drumming" energy

function detectOnsetAndBusyness(data, now) {
  const broadband = bandAvg(data, 1, 64); // wide sweep across low+mid, not just bass
  rollingAvg = lerp(rollingAvg, broadband, 0.05);
  const jump = broadband - rollingAvg;

  if (jump > 0.05 && broadband > 0.12) {
    onsetTimes.push(now);
  }
  // drop onsets older than the window
  while (onsetTimes.length && now - onsetTimes[0] > ONSET_WINDOW_MS) {
    onsetTimes.shift();
  }
  prevBroadband = broadband;
  return {
    broadband,
    onsetCount: onsetTimes.length,
    busy: onsetTimes.length >= ONSET_THRESHOLD_FLURRY
  };
}

/* ----------------------------------------------------------
   Limb performer with DRIFT / DRUM states
---------------------------------------------------------- */
const STATE_DRIFT = 'drift';
const STATE_RETURNING = 'returning';
const STATE_DRUM = 'drum';

class Limb {
  constructor(els, opts) {
    this.els = Array.isArray(els) ? els : [els];
    this.bandStart = opts.bandStart;
    this.bandEnd = opts.bandEnd;
    this.drumRate = opts.drumRate;          // hit probability per frame while in DRUM state
    this.drumMotion = opts.drumMotion;      // (p, intensity) -> {x,y,rot,scale} - relative to home
    this.driftRangeX = opts.driftRangeX;    // [min,max] vmin% for drift target
    this.driftRangeY = opts.driftRangeY;
    this.driftSpeed = opts.driftSpeed || 0.15; // how fast it eases toward drift target (per frame, 0-1)

    this.els.forEach(el => el.style.transformOrigin = opts.originPct || '50% 50%');

    this.state = STATE_DRIFT;
    this.cur = { x: 0, y: 0, rot: 0, scale: 1 };           // current rendered transform
    this.driftTarget = this.randomDriftTarget();
    this.driftRot = 0;
    this.driftRotTarget = (Math.random() - 0.5) * 16;

    // drum sub-state
    this.firing = false;
    this.startTime = 0;
    this.duration = 0;
    this.intensity = 0;
  }

  randomDriftTarget() {
    const [xMin, xMax] = this.driftRangeX;
    const [yMin, yMax] = this.driftRangeY;
    return {
      x: vmin(lerp(xMin, xMax, Math.random())),
      y: vmin(lerp(yMin, yMax, Math.random()))
    };
  }

  setMode(busy) {
    if (busy && this.state === STATE_DRIFT) {
      this.state = STATE_RETURNING;
    } else if (!busy && (this.state === STATE_DRUM || this.state === STATE_RETURNING)) {
      this.state = STATE_DRIFT;
      this.driftTarget = this.randomDriftTarget();
      this.driftRotTarget = (Math.random() - 0.5) * 16;
    }
  }

  maybeFireDrum(energy, chaos) {
    if (this.firing) return;
    const p = Math.pow(energy, 1.3) * this.drumRate * chaos;
    if (Math.random() < p) {
      this.firing = true;
      this.startTime = performance.now();
      this.intensity = 0.5 + energy * 0.5;
      this.duration = 150 + Math.random() * 180; // snappier than drift - this is the "drumming" feel
    }
  }

  apply(x, y, rot, scale, blur) {
    const t = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
    // must include invert/brightness/contrast here too, since setting
    // style.filter from JS overwrites the CSS filter entirely otherwise
    const f = `invert(1) brightness(1.3) contrast(1.1) ${blur > 0.05 ? `blur(${blur.toFixed(1)}px)` : ''}`;
    this.els.forEach(el => { el.style.transform = t; el.style.filter = f; });
  }

  update(energy, chaos, now) {
    if (this.state === STATE_DRIFT) {
      // slow wander toward a target that occasionally changes
      if (Math.random() < 0.004) this.driftTarget = this.randomDriftTarget();
      if (Math.random() < 0.004) this.driftRotTarget = (Math.random() - 0.5) * 16;
      this.cur.x = lerp(this.cur.x, this.driftTarget.x, this.driftSpeed * 0.05);
      this.cur.y = lerp(this.cur.y, this.driftTarget.y, this.driftSpeed * 0.05);
      this.cur.rot = lerp(this.cur.rot, this.driftRotTarget, 0.01);
      this.cur.scale = 1;
      this.apply(this.cur.x, this.cur.y, this.cur.rot, this.cur.scale, 0);

    } else if (this.state === STATE_RETURNING) {
      // ease back to home (0,0) before drumming begins
      this.cur.x = lerp(this.cur.x, 0, 0.12);
      this.cur.y = lerp(this.cur.y, 0, 0.12);
      this.cur.rot = lerp(this.cur.rot, 0, 0.12);
      this.apply(this.cur.x, this.cur.y, this.cur.rot, 1, 0);
      if (Math.abs(this.cur.x) < 2 && Math.abs(this.cur.y) < 2) {
        this.state = STATE_DRUM;
      }

    } else if (this.state === STATE_DRUM) {
      this.maybeFireDrum(energy, chaos);
      if (this.firing) {
        const t = now - this.startTime;
        let progress = t / this.duration;
        if (progress >= 1) {
          this.firing = false;
          this.apply(0, 0, 0, 1, 0);
        } else {
          const attackEnd = 0.3;
          let eased;
          if (progress < attackEnd) {
            eased = easeOutQuad(progress / attackEnd);
          } else {
            eased = 1 - easeInOutCubic((progress - attackEnd) / (1 - attackEnd));
          }
          const { x, y, rot, scale } = this.drumMotion(eased, this.intensity);
          const blur = eased > 0.8 ? (eased - 0.8) * 8 : 0;
          this.apply(x, y, rot, scale, blur);
        }
      } else {
        this.apply(0, 0, 0, 1, 0);
      }
    }
  }
}

/* ----------------------------------------------------------
   Build limbs
---------------------------------------------------------- */
let limbs = [];

function buildLimbs() {
  limbs = [];

  limbs.push(new Limb(document.getElementById('p-legLeft'), {
    bandStart: 1, bandEnd: 6,
    drumRate: 0.05,
    originPct: '60% 15%',
    driftRangeX: [-18, 18], driftRangeY: [10, 38],
    drumMotion: (p, inten) => ({
      x: -vmin(6) * p * inten, y: vmin(4) * p * inten,
      rot: -10 * p * inten, scale: 1 + 0.03 * p * inten
    })
  }));

  limbs.push(new Limb(document.getElementById('p-legRight'), {
    bandStart: 2, bandEnd: 8,
    drumRate: 0.08,
    originPct: '40% 10%',
    driftRangeX: [-30, -8], driftRangeY: [8, 34],
    drumMotion: (p, inten) => ({
      x: vmin(1.5) * Math.sin(p * Math.PI * 3) * inten, y: vmin(2) * p * inten,
      rot: 6 * Math.sin(p * Math.PI * 3) * inten, scale: 1
    })
  }));

  limbs.push(new Limb(document.getElementById('p-armLeft'), {
    bandStart: 6, bandEnd: 20,
    drumRate: 0.055,
    originPct: '75% 30%',
    driftRangeX: [10, 36], driftRangeY: [-10, 20],
    drumMotion: (p, inten) => ({
      x: -vmin(8) * p * inten, y: vmin(3) * Math.sin(p * Math.PI) * inten,
      rot: -18 * p * inten, scale: 1
    })
  }));

  // HEAD + RIGHT ARM grouped: now drums down onto the LEFT LEG instead of swinging over the head.
  const headGroupEls = ['p-neck','p-face','p-eyes','p-mouth','p-guy','p-armRight']
    .map(id => document.getElementById(id));
  limbs.push(new Limb(headGroupEls, {
    bandStart: 20, bandEnd: 60,
    drumRate: 0.04,
    originPct: '50% 20%',
    driftRangeX: [-14, 22], driftRangeY: [-30, -8],
    drumMotion: (p, inten) => ({
      // head dips down and to the left, toward where the left leg sits
      x: -vmin(3) * p * inten,
      y: vmin(16) * p * inten,
      rot: 10 * p * inten,
      scale: 1 - 0.04 * p * inten
    })
  }));
}

buildLimbs();
window.addEventListener('resize', buildLimbs);

/* ----------------------------------------------------------
   Main loop
---------------------------------------------------------- */
function loop() {
  requestAnimationFrame(loop);
  if (!analyser || audio.paused) return;

  analyser.getByteFrequencyData(freqData);
  const now = performance.now();
  const chaos = chaosRange.value / 100 * 1.8;

  const { busy, onsetCount, broadband } = detectOnsetAndBusyness(freqData, now);

  for (const limb of limbs) {
    limb.setMode(busy);
    const energy = bandAvg(freqData, limb.bandStart, limb.bandEnd);
    limb.update(energy, chaos, now);
  }

  debugEl.textContent = `busy:${busy} onsets:${onsetCount} broadband:${broadband.toFixed(2)}`;
}
requestAnimationFrame(loop);
</script>
</body>
</html>
